[project]
name = "pr-review-agent-example"
version = "0.1.0"
description = "A preview-first GitHub PR review agent using Agno and Nebius"
requires-python = ">=3.11"
dependencies = [
    "agno>=3.1.12,<4",
    "openai>=2.21,<4",
    "pydantic>=2.12,<3",
    "PyGithub>=2.10,<3",
    "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
