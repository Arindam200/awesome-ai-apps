<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Context Relay, NConnect and Nebius Token Factory workflow</title>
  <desc id="desc">Two separate paths: Claude Code history is captured and reviewed by Context Relay before a packet reaches Codex through MCP. Claude Code and Codex each send model requests through Studio1 OSS NConnect to Nebius Token Factory. The verified run captured eleven source events, recorded an accepted MCP receipt and passed the webhook verifier.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#e8e7e1" stroke-width="1"/>
    </pattern>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#7066c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#138c82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="#f5f3ee"/>
  <rect width="1600" height="960" fill="url(#grid)" opacity="0.48"/>

  <rect x="64" y="48" width="193" height="34" rx="17" fill="#1d292c"/>
  <text x="87" y="70" fill="#d6e9df" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ARCHITECTURE</text>
  <text x="64" y="146" fill="#1b292c" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.7">One task. Two coding agents.</text>
  <text x="64" y="185" fill="#52615e" font-family="Arial, sans-serif" font-size="21">NConnect routes model calls to Nebius. Context Relay carries reviewed work through MCP.</text>
  <text x="1536" y="69" text-anchor="end" fill="#687772" font-family="Arial, sans-serif" font-size="16" font-weight="700">VERIFIED LOCAL RUN · 05 NOV 2026</text>

