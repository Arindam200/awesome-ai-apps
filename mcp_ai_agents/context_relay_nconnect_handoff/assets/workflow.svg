  <text x="98" y="266" fill="#524ba8" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.8">01  CONTEXT PATH</text>
  <rect x="1334" y="243" width="169" height="32" rx="16" fill="#eeecf9"/>
  <text x="1418" y="264" text-anchor="middle" fill="#625ab4" font-family="Arial, sans-serif" font-size="14" font-weight="700">REVIEWED HANDOFF</text>

