[project]
name = "image-aware-pdf-rag"
version = "0.1.0"
description = "Multimodal RAG for PDFs — text, charts, tables, and diagrams with page-level citations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF",
    "Pillow",
    "faiss-cpu",
    "sentence-transformers",
    "numpy",
    "openai",
    "streamlit",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "app",
    "chunking",
    "citations",
    "ingestion",
    "markdown_utils",
    "pipeline",
    "vision",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "embeddings*",
    "interfaces*",
    "providers*",
    "retrieval*",
    "vectorstores*",
]
