[project]
name = "llm-cost-tracker-example"
version = "0.1.0"
description = "Local usage and configured-rate cost observability for compatible chat clients"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.21,<4",
    "httpx>=0.28,<1",
    "python-dotenv>=1.2,<2",
    "streamlit>=1.50,<2",
    "pandas>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
